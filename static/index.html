<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estudio de Uñas Ámbar · WhatsApp</title>
<style>
  :root{
    --fondo:#0b141a; --panel:#111b21; --head:#202c33; --mio:#005c4b;
    --otro:#202c33; --texto:#e9edef; --sub:#8696a0; --linea:#222d34; --acento:#00a884;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0f12 radial-gradient(circle at 50% 0%,#15242b 0%,#0a0f12 60%);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--texto);padding:16px}
  .tel{width:min(430px,100%);height:min(760px,92vh);background:var(--fondo);border-radius:18px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.55);border:1px solid #1f2c33}
  header{background:var(--head);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00a884,#0b5f4d);
    display:grid;place-items:center;font-weight:700;font-size:16px}
  .quien{flex:1;min-width:0}
  .quien b{display:block;font-size:15px;font-weight:600}
  .quien span{font-size:12px;color:var(--sub)}
  .chat{flex:1;min-height:0;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px;
    scrollbar-width:thin;scrollbar-color:#2a3942 transparent;
    background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:18px 18px}
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:#2a3942;border-radius:3px}
  .chat::-webkit-scrollbar-track{background:transparent}
  .fila{display:flex;width:100%}
  .fila.mio{justify-content:flex-end}
  .burbuja{max-width:82%;padding:8px 11px;border-radius:10px;font-size:14.5px;line-height:1.42;
    white-space:pre-wrap;word-break:break-word;position:relative;animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .bot .burbuja{background:var(--otro);border-top-left-radius:3px}
  .mio .burbuja{background:var(--mio);border-top-right-radius:3px}
  .hora{font-size:10.5px;color:rgba(233,237,239,.55);margin-left:6px;float:right;margin-top:5px}
  .opciones{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .opciones button{background:#1f2c33;color:#00d3a0;border:1px solid #2a3942;border-radius:8px;
    padding:8px 10px;font-size:13.5px;text-align:center;cursor:pointer;font-family:inherit}
  .opciones button:hover{background:#26363f}
  .opciones.usado button{opacity:.4;pointer-events:none}
  form{display:flex;gap:8px;padding:8px 10px;background:var(--head);flex-shrink:0}
  input{flex:1;background:#2a3942;border:none;border-radius:20px;padding:11px 16px;color:var(--texto);
    font-size:14.5px;font-family:inherit;outline:none}
  .enviar{width:44px;height:44px;border-radius:50%;border:none;background:var(--acento);color:#0b141a;
    font-size:18px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
  .gate{position:absolute;inset:0;background:rgba(6,10,12,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;z-index:5}
  .gate h1{font-size:18px;margin:0}
  .gate p{color:var(--sub);font-size:13px;margin:0;max-width:280px}
  .gate input{background:#2a3942;border:1px solid #2a3942;border-radius:10px;text-align:center;width:200px}
  .gate button{background:var(--acento);border:none;color:#0b141a;font-weight:600;padding:10px 22px;
    border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px}
  .gate .err{color:#f15c6d;font-size:12.5px;min-height:16px}
  .escritorio{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
  .nota{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);
    color:#c8d2d6;font-size:11px;padding:4px 10px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<div class="tel">
  <header>
    <div class="avatar" id="ini">EN</div>
    <div class="quien"><b id="nombre">Estudio de Uñas Ámbar</b><span id="estado">en línea</span></div>
  </header>
  <div class="escritorio">
    <div class="chat" id="chat"></div>
    <div class="gate" id="gate">
      <h1>Demo privada</h1>
      <p>Escribe el código de acceso para probar el asistente del estudio de uñas.</p>
      <input id="codigo" placeholder="código" autocomplete="off" />
      <div class="err" id="err"></div>
      <button id="entrar">Entrar</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="texto" placeholder="Escribe un mensaje" />
      <button class="enviar" type="submit" aria-label="Enviar">➤</button>
    </form>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('texto');
const gate = document.getElementById('gate');
const errEl = document.getElementById('err');
const codigoEl = document.getElementById('codigo');
let sid = null, codigo = '';

const hora = () => new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});

function burbuja(texto, quien, opciones){
  const fila = document.createElement('div');
  fila.className = 'fila ' + quien;
  const b = document.createElement('div');
  b.className = 'burbuja';
  b.textContent = texto;
  const h = document.createElement('span');
  h.className = 'hora'; h.textContent = hora();
  b.appendChild(h);
  if (opciones && opciones.length){
    const o = document.createElement('div');
    o.className = 'opciones';
    opciones.forEach(op => {
      const btn = document.createElement('button');
      btn.textContent = op.label;
      // Al motor le viaja el id; a la burbuja, la etiqueta legible.
      btn.onclick = () => enviar(op.id, false, op.label);
      o.appendChild(btn);
    });
    b.appendChild(o);
  }
  fila.appendChild(b); chat.appendChild(fila);
  chat.scrollTop = chat.scrollHeight;
}
function pintar(respuestas){
  // Los botones de mensajes viejos ya no aplican: se quedan visibles pero inertes.
  document.querySelectorAll('.opciones').forEach(o => o.classList.add('usado'));
  (respuestas||[]).forEach(r => burbuja(r.texto, 'bot', r.opciones));
  input.focus();
}
function esperar(on){
  document.getElementById('estado').textContent = on ? 'escribiendo…' : 'en línea';
}

async function enviar(texto, silencioso, etiqueta){
  if (!texto.trim() || !sid) return;
  if (!silencioso) burbuja(etiqueta || texto, 'mio');
  input.value = ''; esperar(true);
  try{
    const r = await fetch('/api/mensaje', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sid, texto, codigo})});
    if (r.status === 401){ gate.style.display = 'flex'; throw new Error('codigo'); }
    const data = await r.json();
    esperar(false);
    pintar(data.respuestas);
  }catch(e){ esperar(false); }
}

form.addEventListener('submit', e => { e.preventDefault(); enviar(input.value); });

async function entrar(){
  codigo = codigoEl.value.trim(); errEl.textContent = '';
  const r = await fetch('/api/sesion', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({codigo})});
  if (!r.ok){ errEl.textContent = 'Código incorrecto.'; return; }
  const data = await r.json();
  sid = data.sid; gate.style.display = 'none';
  chat.innerHTML = '';
  pintar(data.respuestas);
  input.focus();
}
document.getElementById('entrar').onclick = entrar;
codigoEl.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

fetch('/api/negocio').then(r => r.json()).then(n => {
  document.getElementById('nombre').textContent = n.nombre;
  document.getElementById('ini').textContent = n.nombre.split(' ').map(p => p[0]).slice(-2).join('');
  if (!n.codigo_requerido) { gate.style.display = 'none'; entrar(); }
});
</script>
</body>
</html>
