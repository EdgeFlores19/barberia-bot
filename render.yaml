# Render (plan free) — sin Docker: runtime python nativo.
# Los secretos NO van aquí; se definen en el panel y este archivo solo los declara.
services:
  - type: web
    name: navajazo-bot
    runtime: python
    plan: free
    region: oregon
    # Desplegar en cada push a la rama de producción. Sin esto, Render no
    # redespliega solo y el código de main se queda viejo en producción.
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Render inyecta $PORT; uvicorn debe escuchar en 0.0.0.0 para ser alcanzable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_CODE
        sync: false # se captura en el panel, nunca en el repo
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MAX_MENSAJES_POR_SESION
        value: 30
      - key: MAX_MENSAJES_POR_DIA
        value: 600
      - key: SEED_DEMO
        value: 1
      # Google Calendar apagado a propósito: el token es personal.
      - key: GOOGLE_CALENDAR_ID
        value: ""
      # ---------- WhatsApp Cloud API (opcional) ----------
      - key: WA_MODO
        value: graph
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_API_VERSION
        value: v26.0
      - key: MAX_MENSAJES_POR_SESION_WA
        value: "500"
      # ---------- Seguridad y operación ----------
      - key: ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
