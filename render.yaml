# Render (plan free) — sin Docker: runtime python nativo.
# Los secretos NO van aquí; se definen en el panel y este archivo solo los declara.
services:
  - type: web
    name: navajazo-bot
    runtime: python
    # Starter (0.5 CPU / 512 MB, ~$7/mes). Dos razones, no una: los servicios
    # free se duermen a los 15 min sin tráfico (Meta reintenta y el primer
    # mensaje se pierde) y el disco persistente solo existe en planes de pago.
    # Si este archivo dice `free`, el próximo sync del Blueprint puede intentar
    # bajar el servicio y Render descarta el disco al hacerlo.
    plan: starter
    region: oregon
    # Desplegar al hacer push a la rama de producción, pero solo si el CI (GitHub
    # Actions, workflow "tests") salió en verde. `autoDeploy: true` es el nombre
    # obsoleto y desplegaba aunque las pruebas fallaran.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # Render inyecta $PORT; uvicorn debe escuchar en 0.0.0.0 para ser alcanzable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Disco persistente: el sistema de archivos del contenedor se borra en cada
    # deploy, reinicio o (antes) siesta. Sin esto, SQLite nace vacío y el bot
    # "olvida" las citas. 1 GB es de sobra: una cita ocupa ~200 bytes y el
    # precio es $0.25/GB/mes. Con disco adjunto, los deploys dejan de ser
    # cero-downtime: hay unos segundos de caída, aceptable para un bot.
    disk:
      name: ambar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_CODE
        sync: false # se captura en el panel, nunca en el repo
      - key: DEEPSEEK_API_KEY
        sync: false
      # Clave para firmar los sid del chat web. Render la genera una vez y la conserva;
      # sin ella, cada reinicio invalidaría las sesiones abiertas.
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_MENSAJES_POR_SESION
        value: 30
      - key: MAX_MENSAJES_POR_DIA
        value: 600
      - key: SEED_DEMO
        value: 1
      # SQLite vive en el disco montado. Si esta ruta apunta fuera de /var/data
      # (o falta), la base regresa al árbol del repo y se pierde en cada deploy.
      - key: DB_FILE
        value: /var/data/ambar.db
      # Google Calendar apagado a propósito: el token es personal.
      - key: GOOGLE_CALENDAR_ID
        value: ""
      # ---------- WhatsApp Cloud API (opcional) ----------
      - key: WA_MODO
        value: graph
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_API_VERSION
        value: v26.0
      - key: MAX_MENSAJES_POR_SESION_WA
        value: "500"
      # ---------- Seguridad y operación ----------
      - key: ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
